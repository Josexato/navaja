plugins {
    id 'com.android.application'
}

android {
    namespace 'com.josexato.navaja'
    compileSdk 34

    defaultConfig {
        applicationId 'com.josexato.navaja'
        minSdk 24
        targetSdk 34
        // Versión = número de compilación del CI (el mismo de la Release «Build N»); en una compilación local, 0
        def ciRun = (System.getenv('GITHUB_RUN_NUMBER') ?: '0') as int
        def ciSha = (System.getenv('GITHUB_SHA') ?: 'local').take(7)
        versionCode Math.max(1, ciRun)
        versionName "1.0.${ciRun}"
        buildConfigField 'String', 'COMMIT', "\"${ciSha}\""
        // Para la pantalla de inicio: cuándo se terminó de escribir el código (fecha del último commit, hora de Lima)
        // y cuántas veces se compiló ese día (commits de la rama principal desde la medianoche; hace falta el historial)
        def git = { String... a ->
            try {
                def p = (['git'] + a.toList()).execute(null, rootDir)
                def out = p.text.trim()
                return p.waitFor() == 0 ? out : ''
            } catch (Exception ignored) { return '' }
        }
        def lima = TimeZone.getTimeZone('America/Lima')
        def epoch = git('log', '-1', '--format=%ct')
        def codeDate = epoch ? new Date((epoch as long) * 1000L) : new Date()
        def day = codeDate.format('yyyy-MM-dd', lima)
        def today = git('rev-list', '--count', '--first-parent', "--since=${day}T00:00:00-05:00", "--until=${day}T23:59:59-05:00", 'HEAD')
        buildConfigField 'long', 'CODE_TIME', "${codeDate.time}L"
        buildConfigField 'int', 'BUILDS_TODAY', "${today ? Math.max(1, today as int) : 1}"
        // Sólo ARM (los celulares): las librerías de TFLite para emuladores x86 agregaban 9 MB
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firmado con la keystore debug que AGP genera sola, para que el
            // APK del CI sea instalable sin configurar firmas propias.
            signingConfig signingConfigs.debug
        }
    }

    packaging {
        jniLibs {
            // La NPU carga su parte (libQnnHtpV..Skel.so) desde un archivo: las librerías tienen que quedar
            // extraídas al instalar, no dentro del APK.
            useLegacyPackaging true
            // De QNN sólo va la NPU (HTP) de los Snapdragon 8 recientes: V79 (8 Elite), V81 (8 Elite Gen 5) y V85.
            // Fuera quedan su GPU, el DSP viejo y las NPU anteriores, que sumaban unos 30 MB.
            excludes += ['**/libQnnGpu.so', '**/libQnnDsp*.so', '**/libQnnHtpV68*.so', '**/libQnnHtpV69*.so',
                         '**/libQnnHtpV73*.so', '**/libQnnHtpV75*.so']
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Los modelos (siluetas, XFeat) se leen mapeados en memoria: no comprimirlos dentro del APK
    androidResources {
        noCompress 'tflite'
    }

    testOptions {
        unitTests.all {
            maxHeapSize = '2g'
            testLogging {
                events 'passed', 'failed'
                exceptionFormat = 'full'
            }
        }
    }
}

dependencies {
    // Escáner 3D: FileProvider para compartir PDF/modelos y @RequiresApi.
    implementation 'androidx.core:core:1.13.1'
    // Medir desde video: siluetas del objeto con el modelo MagicTouch (Apache 2.0), en el teléfono y sin internet.
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    // Escáner con hoja: XFeat + LighterGlue (Apache 2.0) en la GPU cuando el teléfono la admite.
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.16.1'
    implementation 'org.tensorflow:tensorflow-lite-gpu-api:2.16.1'
    // NPU de los chips Qualcomm (delegado QNN, AI Engine Direct). Las librerías son de Qualcomm (licencia propia, se
    // distribuyen sólo dentro de la app, en binario); las dos versiones tienen que ser la misma.
    implementation 'com.qualcomm.qti:qnn-runtime:2.52.0'
    implementation 'com.qualcomm.qti:qnn-litert-delegate:2.52.0'
    testImplementation 'junit:junit:4.13.2'
    // Sólo en tests: decodifica los QR que genera Navaja para comprobar que son legibles.
    testImplementation 'com.google.zxing:core:3.5.3'
}
