plugins {
    id 'com.android.application'
}

android {
    namespace 'com.josexato.navaja'
    compileSdk 34

    defaultConfig {
        applicationId 'com.josexato.navaja'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firmado con la keystore debug que AGP genera sola, para que el
            // APK del CI sea instalable sin configurar firmas propias.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.all {
            maxHeapSize = '2g'
            testLogging {
                events 'passed', 'failed'
                exceptionFormat = 'full'
            }
        }
    }
}

dependencies {
    // Escáner 3D: FileProvider para compartir PDF/modelos y @RequiresApi.
    implementation 'androidx.core:core:1.13.1'
    testImplementation 'junit:junit:4.13.2'
}
