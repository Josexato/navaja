plugins {
    id 'com.android.application'
}

android {
    namespace 'com.josexato.navaja'
    compileSdk 34

    defaultConfig {
        applicationId 'com.josexato.navaja'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
        // Sólo ARM (los celulares): las librerías de TFLite para emuladores x86 agregaban 9 MB
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firmado con la keystore debug que AGP genera sola, para que el
            // APK del CI sea instalable sin configurar firmas propias.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // El modelo de siluetas se lee mapeado en memoria: no comprimirlo dentro del APK
    androidResources {
        noCompress 'tflite'
    }

    testOptions {
        unitTests.all {
            maxHeapSize = '2g'
            testLogging {
                events 'passed', 'failed'
                exceptionFormat = 'full'
            }
        }
    }
}

dependencies {
    // Escáner 3D: FileProvider para compartir PDF/modelos y @RequiresApi.
    implementation 'androidx.core:core:1.13.1'
    // Medir desde video: siluetas del objeto con el modelo MagicTouch (Apache 2.0), en el teléfono y sin internet.
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    testImplementation 'junit:junit:4.13.2'
    // Sólo en tests: decodifica los QR que genera Navaja para comprobar que son legibles.
    testImplementation 'com.google.zxing:core:3.5.3'
}
